[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vormir-sentinel"
version = "0.6.0"
description = "A local, fictional AI terminal experience about knowledge, sacrifice, and a ghost in the machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "888xiyan" }]
keywords = ["cli", "interactive-fiction", "ai", "ollama", "arg"]
dependencies = [
    "rich>=13.7",
    "pyreadline3>=3.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "build>=1.2",
    "pytest>=8.2",
    "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/888xiyan/vormir-sentinel"
Repository = "https://github.com/888xiyan/vormir-sentinel"
Issues = "https://github.com/888xiyan/vormir-sentinel/issues"

[project.scripts]
vormir-sentinel = "vormir_sentinel.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vormir_sentinel = ["assets/*", "assets/templates/*", "scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# The content generator stores long multilingual/artistic strings verbatim.
extend-exclude = ["tools/generate_content.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vormir_sentinel"]
