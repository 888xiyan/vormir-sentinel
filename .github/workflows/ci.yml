name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/vormir_sentinel

      - name: Test
        run: pytest -q

      - name: Verify puzzle assets
        run: python tools/verify_relics.py

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m build

      - name: Check release metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/release_check.py --wheel dist/vormir_sentinel-0.5.0-py3-none-any.whl
